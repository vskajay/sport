name: Build and deploy ASP.NET app to Azure Web App - vvksport

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "No .csproj file found."
            exit 1
          }

          Write-Host "Project: $($project.FullName)"

      - name: Restore
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          msbuild $project.FullName `
            /t:Restore

      - name: Build
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          Write-Host "Building: $($project.FullName)"

          msbuild $project.FullName `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:OutputPath="$env:GITHUB_WORKSPACE\bin\Release\"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed."
            exit $LASTEXITCODE
          }

      - name: Publish
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          $publishPath = "$env:GITHUB_WORKSPACE\publish"

          Write-Host "Publishing: $($project.FullName)"
          Write-Host "Publish path: $publishPath"

          New-Item -ItemType Directory -Force -Path $publishPath | Out-Null

          msbuild $project.FullName `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:OutputPath="$env:GITHUB_WORKSPACE\bin\Release\" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:PublishUrl="$publishPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Publish failed."
            exit $LASTEXITCODE
          }

      - name: Verify publish
        shell: pwsh
        run: |
          $publishPath = "$env:GITHUB_WORKSPACE\publish"

          if (-not (Test-Path $publishPath)) {
            Write-Error "Publish folder was not created."
            exit 1
          }

          $files = Get-ChildItem $publishPath -Recurse

          if ($files.Count -eq 0) {
            Write-Error "Publish folder is empty."
            exit 1
          }

          Write-Host "Published files:"
          $files | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}\publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vvksport'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2ACB1493A22F4B0981B76249BA8A7EED }}
