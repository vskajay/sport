name: Build and deploy ASP.NET app to Azure Web App - vvksport

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Find the actual project file
      - name: Find project
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Filter *.csproj -Recurse

          if ($projects.Count -eq 0) {
            Write-Error "No .csproj file found."
            exit 1
          }

          Write-Host "Projects found:"
          $projects | ForEach-Object {
            Write-Host $_.FullName
          }

      # Restore the project
      - name: Restore
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          Write-Host "Restoring: $($project.FullName)"

          msbuild $project.FullName `
            /t:Restore `
            /p:Configuration=Release

      # Build the project
      - name: Build
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          Write-Host "Building: $($project.FullName)"

          msbuild $project.FullName `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      # Publish classic ASP.NET Web Application
      - name: Publish
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          Write-Host "Project: $($project.FullName)"
          Write-Host "Publish path: $publishPath"

          New-Item -ItemType Directory -Force -Path $publishPath | Out-Null

          msbuild $project.FullName `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild publish failed."
            exit $LASTEXITCODE
          }

      # Check published files
      - name: Verify publish
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          Write-Host "Checking publish directory:"
          Write-Host $publishPath

          if (-not (Test-Path $publishPath)) {
            Write-Error "Publish folder was not created."
            exit 1
          }

          $files = Get-ChildItem $publishPath -Recurse

          if ($files.Count -eq 0) {
            Write-Error "Publish folder is empty."
            exit 1
          }

          Write-Host "Published files:"
          $files | Select-Object FullName

      # Upload published application
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}\publish


  deploy:
    runs-on: windows-latest

    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Show deployment files
        shell: pwsh
        run: |
          Write-Host "Files to deploy:"
          Get-ChildItem ./publish -Recurse |
            Select-Object FullName

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vvksport'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2ACB1493A22F4B0981B76249BA8A7EED }}
